<style>
:root {
  --bg: #eef3f7; --surface: #fff; --ink: #12202d; --muted: #5a6b7a; --line: #d5dfe8;
  --accent: #0b5cad; --accent-ink: #fff; --accent-soft: #dcebfa; --warn: #a84300; --warn-soft: #fde9d9;
  --brand-red: #d7262e; --brand-navy: #0b2d6b;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1620; --surface: #15212d; --ink: #e6eef5; --muted: #93a6b8; --line: #263646;
    --accent: #5aa7f0; --accent-ink: #06121e; --accent-soft: #17324d; --warn: #f2a46b; --warn-soft: #3a2414; --brand-navy: #fff; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
button { font-family: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
header { max-width: 1200px; margin: 0 auto; padding: 18px 20px 6px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-align: left; }
.brand svg { width: 34px; height: 46px; flex: none; }
.brand .wm { font: 700 34px/0.95 var(--font-display); letter-spacing: .5px; text-transform: uppercase; color: var(--brand-navy); }
.brand .wm span { color: var(--brand-red); }
.brand .sub { display: block; font: 500 13px var(--font-body); letter-spacing: .2px; text-transform: none; color: var(--muted); margin-top: 3px; }
.hdr-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.lang { background: none; border: 0; padding: 2px 0; font: 500 15px var(--font-body); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.lang .abbr { display: none; }
.source { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22a55b; flex: none; }
@media (max-width: 640px) {
  header { position: relative; }
  .brand .wm { font-size: 28px; } .brand svg { width: 28px; height: 38px; }
  .lang { position: absolute; top: 20px; right: 20px; font-weight: 600; } .lang .full { display: none; } .lang .abbr { display: inline; }
  .hdr-r { align-items: flex-start; }
  .share-site { position: absolute; top: 15px; right: 56px; padding: 6px 9px; }
  .share-site span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .share-site svg { width: 17px; height: 17px; }
  .brand { padding-right: 84px; } .brand .wm { font-size: 26px; white-space: nowrap; }
}
.disclaimer { max-width: 1160px; margin: 6px auto 10px; padding: 8px 12px; font-size: 13px; background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 6px; }
@media (max-width: 1200px) { .disclaimer { margin: 6px 20px 10px; } }
.dshort { display: none; }
@media (max-width: 820px) { .dlong { display: none; } .dshort { display: inline; } }

/* ---------- sport picker (home) ---------- */
.home { max-width: 1200px; margin: 0 auto; padding: 4px 20px 30px; }
.home-top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; margin: 6px 0 16px; }
.home h2 { font: 700 30px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .4px; margin: 0; }
.home-top p { margin: 4px 0 0; color: var(--muted); }
.cta { font: 700 18px/1 var(--font-display); text-transform: uppercase; letter-spacing: .6px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 13px 16px; cursor: pointer; }
.cta:hover { filter: brightness(1.08); }
.grp { margin: 0 0 20px; }
.grp h3 { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .9px; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.grp h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.tile { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; color: var(--ink); position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); }
.tile:hover { border-color: var(--c); box-shadow: 0 8px 22px -16px rgba(0,0,0,.5); }
.tile .ic { grid-row: span 2; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.tile .ic svg { width: 26px; height: 26px; }
.tile .tn { font: 700 19px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .3px; overflow-wrap: anywhere; }
.tile .tc { font-size: 12.5px; color: var(--muted); }
.tile .tc b { color: var(--ink); font-weight: 600; }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; gap: 8px; } .tile { grid-template-columns: 26px 1fr; gap: 6px 8px; padding: 10px 10px 10px 12px; align-items: center; } .tile .ic { grid-row: auto; width: 26px; height: 26px; border-radius: 6px; } .tile .ic svg { width: 17px; height: 17px; } .tile .tn { font-size: 15px; overflow-wrap: normal; } .tile .tc { grid-column: 1 / -1; font-size: 12px; } }
.recent { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; }
.recent .lbl { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .9px; color: var(--muted); margin-right: 2px; }

/* ---------- sport bar (results) ---------- */
.sbar-wrap { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.sbar-in { max-width: 1200px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 8px; align-items: center; }
.sbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; align-items: center; flex: 1; min-width: 0; padding: 2px 0; }

.sbar .sep { width: 1px; height: 22px; background: var(--line); flex: none; margin: 0 4px; }
.schip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px 6px 8px; font: 500 13.5px var(--font-body); cursor: pointer; white-space: nowrap; }
.schip svg { width: 18px; height: 18px; color: var(--c, var(--muted)); }
.schip[aria-pressed="true"] { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #fff; }
.schip[aria-pressed="true"] svg { color: #fff; }
.schip.home-btn { padding: 6px 12px; font-weight: 600; }

/* ---------- results layout ---------- */
main { max-width: 1200px; margin: 0 auto; padding: 14px 20px 40px; display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 16px; position: sticky; top: 64px; }
@media (max-width: 820px) { .panel { position: static; } }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
legend, .lbl { font: 600 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 8px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 500 13px var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink); padding: 7px; font: 500 13px var(--font-body); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select, input[type="date"], input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 14px var(--font-body); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.range-out { font: 700 18px var(--font-display); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.linkbtn { background: none; border: 0; color: var(--accent); font: 500 13px var(--font-body); cursor: pointer; padding: 0; justify-self: start; text-decoration: underline; text-underline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.ftoggle, .fdone { display: none; }
@media (max-width: 820px) {
  .ftoggle { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); cursor: pointer; }
  .ftoggle[aria-expanded="true"] { border-color: var(--accent); }
  .ft-k { font: 700 16px var(--font-display); text-transform: uppercase; letter-spacing: .4px; }
  .ft-s { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font: 600 11px var(--font-body); padding: 1px 7px; margin-left: 4px; vertical-align: 2px; }
  .panel { padding: 12px 14px; gap: 14px; }
  .panel.collapsed > :not(.ftoggle) { display: none !important; }
  .fdone { display: block; width: 100%; }
}
.chev { display: inline-block; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 0; transition: transform .15s; }
[aria-expanded="true"] > .chev, .card[aria-expanded="true"] .chev { transform: rotate(-135deg); margin: 4px 4px 0 0; }

.summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0 0 12px; }
.summary h2 { font: 700 26px/1.1 var(--font-display); text-transform: uppercase; margin: 0; }
.summary p { margin: 0; color: var(--muted); font-size: 14px; }
.notice { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 6px; padding: 9px 12px; font-size: 13px; margin-bottom: 10px; }
.list { display: grid; gap: 8px; }
.dayhead { display: flex; align-items: baseline; gap: 10px; margin: 16px 0 2px; font: 700 18px var(--font-display); text-transform: uppercase; letter-spacing: .4px; }
.dayhead:first-child { margin-top: 0; }
.dayhead small { font: 500 13px var(--font-body); text-transform: none; letter-spacing: 0; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 14px; align-items: start; cursor: pointer; }
.card:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); border-left-color: var(--c); }
.card[aria-expanded="true"] { border-color: var(--c); box-shadow: 0 6px 22px -14px rgba(0,0,0,.45); }
@media (max-width: 520px) { .card { grid-template-columns: 74px 1fr; } .card .side { grid-column: 1 / -1; justify-items: start; text-align: left; grid-auto-flow: column; justify-content: start; gap: 12px; } }
.time { font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.time small { display: block; font: 500 13px var(--font-body); color: var(--muted); margin-top: 3px; }
.what { display: grid; gap: 3px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: .6px; color: var(--c); }
.pill svg { width: 14px; height: 14px; }
.name { font-weight: 600; }
.loc { font-size: 14px; color: var(--accent); font-weight: 500; }
.loc svg { width: 13px; height: 13px; fill: currentColor; vertical-align: -1px; margin-right: 3px; }
.meta { font-size: 13px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 600 11px var(--font-body); border-radius: 4px; padding: 2px 6px; background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--ink); }
.tag.w { background: var(--accent-soft); color: var(--accent); }
.tag.now { background: #d8f3e3; color: #14663a; }
.tag.cx { background: var(--warn-soft); color: var(--warn); }
.side { text-align: right; font-size: 13px; display: grid; gap: 4px; justify-items: end; }
.km { font: 700 18px var(--font-display); }
.cost { max-width: 210px; }
.book { display: inline-flex; align-items: center; align-self: center; gap: 3px; padding: 5px 10px; border-radius: 6px; background: var(--accent); color: var(--accent-ink) !important; font: 600 13px var(--font-body, system-ui); text-decoration: none; white-space: nowrap; }
.book svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.book:hover { filter: brightness(1.08); }
.htb-link { white-space: nowrap; color: var(--accent); }
.more { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.card.cancelled { opacity: .55; }
.details { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; cursor: default; }
@media (max-width: 640px) { .details { grid-template-columns: 1fr; } }
.facts { display: grid; grid-template-columns: 86px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; padding-top: 2px; }
.facts dd { margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) !important; text-decoration: none; font: 500 13px var(--font-body); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) !important; }
.report { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--accent); }
.side-d { display: grid; gap: 14px; align-content: start; }
.gmap { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.gmap iframe { display: block; width: 100%; aspect-ratio: 600 / 380; border: 0; }
.gmap figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gmap iframe { filter: invert(.9) hue-rotate(180deg) saturate(.85) brightness(.95); } }
:root[data-theme="dark"] .gmap iframe { filter: invert(.9) hue-rotate(180deg) saturate(.85) brightness(.95); }
.also h4 { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 8px; }
.also ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.also li { display: grid; grid-template-columns: 12px 108px 1fr; gap: 8px; align-items: center; }
.also li i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.also li span:nth-child(2) { font-variant-numeric: tabular-nums; color: var(--muted); }
.also li.cur { font-weight: 600; }
.few { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-top: 4px; padding: 14px 16px; background: var(--accent-soft); border-radius: 8px; font-size: 14px; }
.few .cta { font-size: 15px; padding: 9px 14px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 24px; text-align: center; color: var(--muted); }
.empty .et { font: 700 20px var(--font-display); text-transform: uppercase; color: var(--ink); margin: 0 0 6px; }
.empty p { margin: 0 0 14px; }

/* ---------- footer ---------- */
.site-foot { max-width: 1200px; margin: 20px auto 0; padding: 0 20px 40px; font-size: 14px; color: var(--muted); }
.site-foot a { color: var(--accent); }
.fb { display: grid; grid-template-columns: 1fr auto; gap: 14px 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 26px; }
.fb h2 { font: 700 20px var(--font-display); text-transform: uppercase; color: var(--ink); margin: 0 0 4px; }
.fb p { margin: 0; }
.fb .cta { text-decoration: none; display: inline-block; font-size: 16px; color: var(--accent-ink); }
@media (max-width: 720px) { .fb { grid-template-columns: 1fr; } }
.fcols { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 24px; border-top: 1px solid var(--line); padding-top: 22px; }
@media (max-width: 820px) { .fcols { grid-template-columns: 1fr; gap: 18px; } }
.fcols h3 { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .8px; color: var(--ink); margin: 0 0 8px; }
.fcols p { margin: 0 0 8px; line-height: 1.5; }
.fcols ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.fcols details { border-bottom: 1px solid var(--line); padding: 8px 0; }
.fcols details:first-of-type { border-top: 1px solid var(--line); }
.fcols summary { cursor: pointer; color: var(--ink); font-weight: 500; }
.fbase { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; font-size: 13px; }
.hdr-btns { display: flex; align-items: center; gap: 16px; }
.share-site { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font: 500 14px var(--font-body); color: var(--accent); cursor: pointer; }
.share-site svg, .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { gap: 6px; cursor: pointer; }
dialog.share { border: 0; border-radius: 14px; padding: 0; width: min(420px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); box-shadow: 0 18px 50px rgba(0,0,0,.3); }
dialog.share::backdrop { background: rgba(8,18,30,.5); }
.sh-in { padding: 18px 18px 16px; }
.sh-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sh-top h2 { font: 700 24px/1.1 var(--font-display); margin: 0; letter-spacing: .3px; }
.sh-x { background: none; border: 0; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0 4px; }

        ${fact(t("fPlace"), r.venue)}${fact(t("fRoom"), r.room)}${fact(t("fAddress"), r.address)}${fact(t("fCost"), r.cost)}${r.booking ? `<dt>${esc(t("fBooking"))}</dt><dd>${esc(r.booking)} <a class="htb-link" href="/how-to-book/#${htbId(r)}">${esc(t("htbCity", r.priv ? "Canlan" : r.city))}</a></dd>` : ""}${fact(t("fNotes"), r.notes)}
      </dl>
      <div class="btns">
        <a class="btn primary" href="${gmaps(r, true)}" target="_blank" rel="noopener">${esc(t("directions"))}</a>
        <a class="btn" href="${gmaps(r, false)}" target="_blank" rel="noopener">${esc(t("openMaps"))}</a>
        ${bookUrl(r) ? `<a class="btn" data-book href="${bookUrl(r)}" target="_blank" rel="noopener">${esc(r.priv ? t("bookOnline") : t("bookCity", r.city))}</a>` : ""}${link && !(r.priv && r.link) ? `<a class="btn" href="${link}" target="_blank" rel="noopener">${esc(t("official"))}</a>` : ""}
        <button type="button" class="btn" data-share="${r.id}|${r.iso}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>${esc(t("shareBtn"))}</button>
      </div>
      <a class="report" href="${mailto(t("repSubject", r.session, r.venue), t("repBody", r.session, r.venue, r.city, dTxt, fmt(r.start) + "–" + fmt(r.end)))}">${esc(t("reportLink"))}</a>
    </div>
    <div class="side-d">${GMAPS_KEY ? gmapEmbed(r) : ""}<div class="also"><h4>${esc(t("alsoAt", dateFmt(r.dateObj, { weekday: "long" })))}</h4>
      <ul>${same.map(x => `<li class="${x.id === r.id ? "cur" : ""}" style="--c:${SCOL[x.sport]}"><i></i><span>${fmt(x.start)}–${fmt(x.end)}</span><span>${esc(x.session)}</span></li>`).join("")}</ul></div></div>
  </div>`;
}
function render() {
  buildChips();
  const dates = datesFor(), rows = dates.flatMap(iso => rowsOn(iso)), open = rows.filter(r => !r.cancelled);
  const title = state.sport === "all" ? spLbl("all") : spLbl(state.sport);
  $("sumTitle").textContent = `${title} · ${t("sess", open.length)}`;
  const vn = new Set(open.map(r => r.venue)).size, per = state.period ? " · " + t(PERIODS[state.period][0]).toLowerCase() : "";
  $("sumSub").textContent = `${whenTxt()}${state.when === "today" ? " (" + t("restToday") + ")" : ""} · ${t("venues", vn)} · ${whereTxt()}${per}`;
  // mobile summary
  const n = (state.mode === "near" || state.city !== "All") + (state.when !== "today") + (state.period !== 0) + (state.who !== "any") + state.women;
  $("fbadge").textContent = n; $("fbadge").hidden = !n;
  $("fsum").textContent = [whereTxt(), whenTxt(), state.who !== "any" ? t("who")[state.who] : ""].filter(Boolean).join(" · ");
  $("fdone").textContent = t("show", t("sess", open.length));
  // notices
  const notes = [], first = dates[0], last = dates[dates.length - 1];
  const stale = [...new Set(rows.filter(r => VALID_TO[r.city + "|" + kindOf(r)] && r.iso > VALID_TO[r.city + "|" + kindOf(r)]).map(r => r.city))];
  if (stale.length) notes.push(t("staleN", stale.join(", ")));
  if (last >= "2026-12-19" && first <= "2027-01-04") notes.push(t("holidayN"));
  const wk = [...new Set(rows.filter(r => WEEKLY[r.city + "|" + kindOf(r)]).map(r => r.city + "|" + kindOf(r)))];
  if (wk.length && dates.some(d => d > "2026-11-29" || d < "2026-11-22")) notes.push(t("weeklyN", wk.map(k => { const [c, kk] = k.split("|"); return t("weeklyItem", c, kk, WEEKLY[k]); }).join("; ")));
  if (sharedGone) { notes.unshift(t("shGone")); sharedGone = false; }
  $("notices").innerHTML = notes.map(x => `<div class="notice">${esc(x)}</div>`).join("");
  if (!rows.length) {
    $("list").innerHTML = `<div class="empty"><p class="et">${esc(t("emptyT"))}</p><p>${esc(t("emptyP"))}</p>${state.when !== "week" ? `<button type="button" class="cta" data-week>${esc(t("show7"))}</button>` : ""}</div>`;
    return; }
  let html = "";
  if (dates.length === 1) html = rows.map(card).join("");
  else for (const iso of dates) { const day = rows.filter(r => r.iso === iso); if (!day.length) continue;
    const lbl = (iso === isoToday() ? t("todayDot") : iso === isoPlus(1) ? t("tomorrowDot") : "") + dateFmt(parseISO(iso), { weekday: "long", month: "short", day: "numeric" });
    html += `<h3 class="dayhead"><span>${esc(lbl)}</span><small>${esc(t("sess", day.filter(r => !r.cancelled).length))}</small></h3>` + day.map(card).join(""); }
  if (dates.length === 1 && open.length <= 3) html += `<div class="few"><span>${esc(t("few", open.length))}</span><button type="button" class="cta" data-week>${esc(t("show7"))}</button></div>`;
  $("list").innerHTML = html;
}

/* ---------- view switching ---------- */
function showHome() { state.sport = null; openId = null; $("home").hidden = false; $("results").hidden = true; $("sbarWrap").hidden = true; buildHome(); if (location.hash) history.replaceState(null, "", location.pathname + location.search); }
function pickSport(k, when) {
  state.sport = k; openId = null; if (when) state.when = when;
  if (k !== "all") { recent = [k, ...recent.filter(x => x !== k)].slice(0, 4); }
  $("home").hidden = true; $("results").hidden = false; $("sbarWrap").hidden = false;
  try { history.replaceState(null, "", "#" + k); } catch {}
  buildSportBar(); buildCities(); update(); window.scrollTo({ top: 0 });
}
function update() { save(); render(); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-sport]"); if (s) { pickSport(s.dataset.sport); return; }
  if (e.target.closest("[data-home]")) { showHome(); return; }
  if (e.target.closest("[data-week]")) { state.when = "week"; update(); return; }
});
$("brand").onclick = showHome;
$("allToday").onclick = () => pickSport("all", "today");
$("list").addEventListener("click", e => { if (e.target.closest("a, [data-stop], [data-week]")) return; const c = e.target.closest(".card"); if (c) toggleCard(c.dataset.k); });
$("list").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) { e.preventDefault(); toggleCard(e.target.dataset.k); } });
function toggleCard(k) { openId = openId === k ? null : k; render(); const el = document.querySelector(`.card[data-k="${k}"]`); if (el) { el.focus({ preventScroll: true }); if (openId) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } }
$("modeCity").onclick = () => { state.mode = "city"; update(); };
$("modeNear").onclick = () => { state.mode = "near"; update(); };
$("city").onchange = e => { state.city = e.target.value; update(); };
$("origin").oninput = e => { const p = matchPlace(e.target.value); if (p) { state.origin = p[0]; state.geo = null; render(); } updateHint(); };
$("origin").onchange = e => { const p = matchPlace(e.target.value); if (p) { state.origin = p[0]; state.geo = null; e.target.value = p[0]; update(); } updateHint(); };
$("radius").oninput = e => { state.radius = +e.target.value; $("radiusOut").textContent = state.radius + " km"; render(); };
$("radius").onchange = () => save();
$("geoBtn").onclick = () => {
  const b = $("geoBtn"); b.textContent = t("locating");
  try { navigator.geolocation.getCurrentPosition(p => { state.geo = [p.coords.latitude, p.coords.longitude]; state.mode = "near"; $("origin").value = ""; b.textContent = t("useLoc"); update(); },
    () => { b.textContent = t("useLoc"); $("originHint").textContent = t("locFail"); }, { timeout: 10000, maximumAge: 600000 }); }
  catch { b.textContent = t("useLoc"); $("originHint").textContent = t("locFail"); }
};
$("date").onchange = e => { if (e.target.value) { state.date = e.target.value; state.when = e.target.value === isoToday() ? "today" : "date"; update(); } };
$("women").onchange = e => { state.women = e.target.checked; update(); };
$("resetBtn").onclick = () => { Object.assign(state, { ...DEF, sport: state.sport, date: isoToday() }); buildCities(); update(); };
$("ftoggle").onclick = () => { const p = $("panel"), open = p.classList.toggle("collapsed"); $("ftoggle").setAttribute("aria-expanded", !open); };
$("fdone").onclick = () => { $("panel").classList.add("collapsed"); $("ftoggle").setAttribute("aria-expanded", "false"); $("sumTitle").scrollIntoView({ block: "start", behavior: "smooth" }); };
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (openShared(h)) return; if ((SPK.includes(h) || h === "all") && h !== state.sport) pickSport(h); else if (!h && state.sport) showHome(); });

/* ---------- sharing ----------
   Links only (no third-party scripts or trackers). Facebook gets the URL alone: its Platform Policy
   forbids pre-filling the user's message. X, WhatsApp, Bluesky and Reddit document pre-filled text
   the user can edit before posting. Brand logos are not drawn; services are named in plain text. */
const SITE_URL = "https://icetimes.ca/sports/";
const shareBase = () => /(^|\.)icetimes\.ca$|github\.io$/.test(location.hostname) ? location.origin + location.pathname : SITE_URL;
const slug = s => norm(s).replace(/ /g, "-");
const skey = r => `${r.sport}-${r.start}-${slug(r.venue)}`;
const touch = () => matchMedia("(pointer: coarse)").matches;
let shareData = null;
document.addEventListener("click", e => { const a = e.target.closest("a[data-book]"); if (!a) return; const c = a.closest(".card"), r = c ? ROWS[+c.dataset.k.split("|")[0]] : null; try { (window.dataLayer = window.dataLayer || []).push({ event: "book_online", ice_city: r ? r.city : "", ice_type: r ? r.sport : "", ice_rink: r ? r.venue : "" }); } catch {} });
function track(method) { try { (window.dataLayer = window.dataLayer || []).push({ event: "share", method, content_type: shareData.kind }); } catch {} }
function sessionShare(r) {
  const d = dateFmt(r.dateObj, { weekday: "short", month: "short", day: "numeric" });
  const tm = fmt(r.start) + "–" + (r.end >= 1440 ? (LANG === "fr" ? "minuit" : "midnight") : fmt(r.end));
  const text = t("shSess", spLbl(r.sport), r.session, d, tm, r.venue, r.city) + " " + t("shSessQ");
  return { kind: "session", title: t("shareSessH"), heading: t("shareSessH"), text, url: shareBase() + "#s/" + r.iso + "/" + skey(r) };
}
function siteShare() {
  if (state.sport && state.sport !== "all") return { kind: "sport", heading: t("shareSportH", spLbl(state.sport).toLowerCase()), title: t("title"), text: t("shSportTxt", spLbl(state.sport)), url: shareBase() + "#" + state.sport };
  return { kind: "site", heading: t("shareSiteH"), title: t("title"), text: t("shSiteTxt"), url: shareBase() };
}
async function startShare(d) {
  shareData = d;
  // Phones: go straight to the system share sheet (covers Messages, Instagram, Messenger, Snapchat...).
  if (navigator.share && touch()) {
    try { await navigator.share({ title: d.title, text: d.text, url: d.url }); track("native"); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  openShareDlg();
}
function openShareDlg() {
  const d = shareData, u = encodeURIComponent(d.url), tx = encodeURIComponent(d.text), both = encodeURIComponent(d.text + " " + d.url);
  const links = [
    ["WhatsApp", `https://wa.me/?text=${both}`],
    ["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${u}`],
    ["X", `https://x.com/intent/tweet?text=${tx}&url=${u}`],
    ["Reddit", `https://www.reddit.com/submit?url=${u}&title=${tx}`],
    ["Bluesky", `https://bsky.app/intent/compose?text=${both}`],
    ...(touch() ? [[t("shText"), `sms:?&body=${both}`]] : []),
    [t("shEmail"), `mailto:?subject=${encodeURIComponent(d.kind === "session" ? t("shEmailSubj") : t("title"))}&body=${encodeURIComponent(d.text + "\n\n" + d.url)}`],
  ];
  $("shH").textContent = d.heading;
  $("shPrev").innerHTML = `${esc(d.text)}<small>${esc(d.url)}</small>`;
  $("shGrid").innerHTML = (navigator.share ? `<button type="button" class="wide" data-native>${esc(t("shNative"))}</button>` : "")
    + links.map(([n, h]) => `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer" data-m="${esc(n)}">${esc(n)}</a>`).join("")
    + `<button type="button" data-copy>${esc(t("shCopy"))}</button>`;
  $("shNote").textContent = t("shNote");
  const dlg = $("shareDlg"); if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
}
function closeShare() { const dlg = $("shareDlg"); if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
async function copyLink(btn) {
  const v = shareData.url; let ok = false;
  try { await navigator.clipboard.writeText(v); ok = true; } catch {
    const ta = document.createElement("textarea"); ta.value = v; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select(); try { ok = document.execCommand("copy"); } catch {} ta.remove(); }
  if (ok) { btn.textContent = t("shCopied"); btn.classList.add("sh-done"); track("copy"); setTimeout(() => { btn.textContent = t("shCopy"); btn.classList.remove("sh-done"); }, 2200); }
  else { prompt(t("shCopy"), v); }
}
$("shareSite").onclick = () => startShare(siteShare());
$("shX").onclick = closeShare;
$("shareDlg").addEventListener("click", e => {
  if (e.target === $("shareDlg")) { closeShare(); return; }
  if (e.target.closest("[data-native]")) { navigator.share({ title: shareData.title, text: shareData.text, url: shareData.url }).then(() => { track("native"); closeShare(); }).catch(() => {}); return; }
  const c = e.target.closest("[data-copy]"); if (c) { copyLink(c); return; }
  const a = e.target.closest("a[data-m]"); if (a) { track(a.dataset.m); setTimeout(closeShare, 150); }
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-share]"); if (!b) return;
  const [id, iso] = b.dataset.share.split("|"), base = ROWS[+id];
  startShare(sessionShare({ ...base, iso, dateObj: parseISO(iso) }));
});
/* Open a shared session link: #s/YYYY-MM-DD/sport-start-venue */
let sharedGone = false;
function openShared(h) {
  const m = /^s\/(\d{4}-\d{2}-\d{2})\/(.+)$/.exec(h); if (!m) return false;
  const [, iso, key] = m, r = ROWS.find(x => skey(x) === key); if (!r) return false;
  Object.assign(state, { mode: "city", city: "All", who: "any", women: false, period: 0 });
  const live = iso >= isoToday() && rowsOn(iso).some(x => x.id === r.id);
  if (live) { state.when = iso === isoToday() ? "today" : "date"; state.date = iso; }
  else { state.when = "week"; sharedGone = true; }
  pickSport(r.sport);
  if (live) { openId = r.id + "|" + iso; render(); const el = document.querySelector(`.card[data-k="${openId}"]`); if (el) setTimeout(() => el.scrollIntoView({ block: "center" }), 50); }
  try { history.replaceState(null, "", "#" + r.sport); } catch {}
  return true;
}

/* ---------- footer + language ---------- */
const FEEDBACK_EMAIL = "feedback@icetimes.ca";
const mailto = (subj, body) => `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(subj)}${body ? "&body=" + encodeURIComponent(body) : ""}`;
function buildFooter() {
  const src = [["Vancouver Park Board", LINKS.Vancouver.gym], ["Burnaby", LINKS.Burnaby.gym], ["North Vancouver (NVRC)", LINKS["North Vancouver"].gym], ["Surrey", LINKS.Surrey.gym],
    ["Richmond sports", LINKS.Richmond.gym], ["Richmond racquet sports", LINKS.Richmond.racquet], ...["Coquitlam", "Port Coquitlam", "Port Moody", "New Westminster", "Delta", "Maple Ridge"].flatMap(c => [[c + " (sports)", LINKS[c].gym], [c + " (ice)", LINKS[c].ice]]), ...Object.entries(PRIVATE_LINKS)];
  const det = (h, p) => `<details><summary>${esc(t(h))}</summary><p>${esc(t(p))}</p></details>`;
  $("siteFoot").innerHTML = `<section class="fb"><div><h2>${esc(t("fbTitle"))}</h2><p>${esc(t("fbText"))}</p></div><div><a class="cta" href="${mailto(t("fbSubject"))}">${esc(t("fbBtn"))}</a><p style="font-size:13px;margin-top:6px">${FEEDBACK_EMAIL}</p></div></section>
  <div class="fcols">
    <div><h3>${esc(t("aboutH"))}</h3><p>${esc(t("aboutP"))}</p><h3 style="margin-top:14px">${esc(t("coverH"))}</h3><p>${esc(t("coverP"))}</p></div>
    <div><h3>${esc(t("srcH"))}</h3><p>${esc(t("srcP"))}</p><ul>${src.map(([n, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join("")}</ul></div>
    <div><h3>${esc(t("infoH"))}</h3><p><a href="/how-to-book/">${esc(t("htbAll"))}</a></p>${det("discH", "discP")}${det("privH", "privP")}</div>
  </div>
  <div class="fbase"><span>${esc(t("copyright", new Date().getFullYear()))}</span><span>${esc(t("notAffiliated"))}</span></div>`;
}
function applyLang() {
  document.documentElement.lang = LANG === "fr" ? "fr-CA" : "en-CA"; document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $("srctext").innerHTML = t("updated", LANG === "fr" ? "22 novembre 2026" : UPDATED);
  const o = LANG === "fr" ? ["en", "English", "EN"] : ["fr", "Français", "FR"];
  $("langBtn").lang = o[0]; $("langBtn").innerHTML = `<span class="full">${o[1]}</span><span class="abbr" aria-hidden="true">${o[2]}</span>`; $("langBtn").setAttribute("aria-label", o[1]);
  buildFooter();
}
$("langBtn").onclick = () => { LANG = LANG === "fr" ? "en" : "fr"; try { localStorage.setItem("dropLang", LANG); } catch {} applyLang(); if (state.sport) { buildSportBar(); buildCities(); render(); } else buildHome(); };

/* ---------- start ---------- */
restore();
$("placeList").innerHTML = PLACES.map(p => `<option value="${esc(p[0])}"></option>`).join("");
applyLang();
{ const h = location.hash.slice(1); if (openShared(h)) {} else if (SPK.includes(h) || h === "all") pickSport(h); else showHome(); }
setInterval(() => { if (state.sport && state.when === "today") render(); else if (!state.sport) buildHome(); }, 5 * 60 * 1000);
</script>
